
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KRN Miner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
      padding: 20px;
    }
    main {
      max-width: 400px;
      margin: auto;
      background: #1d2b43;
      padding: 24px;
      border-radius: 18px;
    }
    button {
      padding: 14px;
      margin: 7px;
      border: 0;
      border-radius: 10px;
      font-weight: bold;
    }
    .mine { background: #35c6ff; }
    .balance { font-size: 32px; color: #52d6ff; }
  </style>
</head>
<body>
<main>
  <h1>💎 KRN Miner</h1>
  <p>Mining & Referral</p>

  <p>Total poin virtual</p>
  <div id="balance" class="balance">0</div>

  <button class="mine" onclick="mine()">
    ⛏️ Mining +1
  </button>

  <p>Level: <span id="level">1</span></p>

  <button onclick="upgrade()">Upgrade 50 poin</button>
  <button onclick="daily()">Bonus harian +10</button>

  <hr>
  <p>Kode referral demo:</p>
  <strong id="referral">KRN-DEMO-001</strong>
  <button onclick="copyReferral()">Salin kode</button>

  <p id="message">
    Poin ini hanya simulasi, bukan token TON.
  </p>
</main>

<script>
let points = 0;
let level = 1;
let lastDaily = "";

function render() {
  document.getElementById("balance").textContent = points;
  document.getElementById("level").textContent = level;
}

function mine() {
  points += level;
  render();
}

function upgrade() {
  if (points < 50) {
    alert("Kumpulkan 50 poin dahulu.");
    return;
  }
  points -= 50;
  level++;
  render();
}

function daily() {
  const today = new Date().toDateString();

  if (lastDaily === today) {
    alert("Bonus sudah diklaim hari ini.");
    return;
  }

  points += 10;
  lastDaily = today;
  render();
}

async function copyReferral() {
  try {
    await navigator.clipboard.writeText(
      document.getElementById("referral").textContent
    );
    alert("Kode demo disalin.");
  } catch {
    alert("Salin kode KRN-DEMO-001 secara manual.");
  }
}

render();
</script>
</body>
</html>
